[env:esp32-s3-wroom-1]
platform = espressif32
; ESP32-S3-WROOM-1 is the module, not a PlatformIO board ID.
; esp32-s3-devkitc-1 is the matching devkit board and uses the same WROOM-1 module.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    makuna/NeoPixelBus @ ^2.8.3

; --- N16R8 Memory Settings ---
; Tells the ESP32 to use the full 16MB of Flash and 8MB of PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; --- USB Settings ---
; CRITICAL for AliExpress S3 boards: Routes the Serial Monitor
; through the USB-C port so you can actually read the text!
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
